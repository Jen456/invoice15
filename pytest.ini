[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
testpaths = tests
python_files = test_*.py
addopts = -p no:cacheprovider -q
filterwarnings =
    ignore::RuntimeWarning:django.db.models.fields
markers =
    tiempos: mide esperas reales de bloqueos en PostgreSQL, con márgenes holgados para la máquina compartida (-m "not tiempos" las deja fuera)
