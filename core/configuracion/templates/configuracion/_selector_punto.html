{% load static %}
{% if fpa_puntos %}
<li class="nav-item dropdown fp-selector-punto" data-seleccion-url="{% url 'configuracion_punto_seleccion' %}">
    <button class="nav-link" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" aria-label="{% if fpa_punto %}Elegir punto de emisión{% else %}Elige tu punto de emisión{% endif %}">
        <i class="fas fa-store" aria-hidden="true"></i><span class="fp-selector-codigo">{% if fpa_punto %}{{ fpa_punto.full_code }}{% else %}Elegir punto{% endif %}</span><i class="fas fa-caret-down" aria-hidden="true"></i>
    </button>
    <div class="dropdown-menu dropdown-menu-right">
        <div class="fp-selector-intro"><strong>Punto para nuevos documentos</strong><p>Tu elección se guarda para esta empresa. Los formularios abiertos conservan su punto.</p></div>
        <div class="fp-selector-estado" role="status" aria-live="polite"></div>
        {% for p in fpa_puntos %}
        <form method="post" action="{% url 'configuracion_punto_seleccionar' %}" class="m-0">
            {% csrf_token %}<input type="hidden" name="punto" value="{{ p.pk }}"><input type="hidden" name="next" value="{{ request.path }}">
            <button type="submit" class="dropdown-item{% if fpa_punto and p.pk == fpa_punto.pk %} active{% endif %}"{% if fpa_punto and p.pk == fpa_punto.pk %} aria-current="true"{% endif %}>
                <strong>{{ p.establishment.name|default:p.establishment.address }}</strong><span>{{ p.description|default:"Punto" }} · {{ p.full_code }}</span><small data-punto-estado="{{ p.pk }}"></small>
            </button>
        </form>
        {% endfor %}
        <a href="{% url 'configuracion_puntos' %}" class="fp-selector-administrar" hidden>Administrar locales y puntos</a>
    </div>
</li>
<script src="{% static 'configuracion/js/puntos.js' %}" defer></script>
{% endif %}
