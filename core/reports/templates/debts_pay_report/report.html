{% extends 'report.html' %}
{% load static %}
{% block assets_report %}
    <script src="{% static 'debts_pay_report/js/report.js' %}" type="text/javascript"></script>
{% endblock %}

{% block content_report %}
    <div class="row">
        <div class="col-lg-5 col-md-12">
            <div class="form-group">
                <label>{{ form.date_range.label }}:</label>
                <div class="input-group mb-3">
                    {{ form.date_range }}
                    <div class="input-group-append">
                        <button class="btn btn-primary btnSearchAll" type="button">
                            <i class="fas fa-calendar-check"></i> Ver todas
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-12">
            <hr>
            <div class="table-responsive">
            <table class="table table-bordered" id="tblReport" style="width:100%;">
                <thead>
                <tr>
                    <th style="width: 15%;">Proveedor</th>
                    <th style="width: 9%;">Identificación</th>
                    <th style="width: 11%;">Número</th>
                    <th style="width: 8%;">Fecha de compra</th>
                    <th style="width: 8%;">Fecha de plazo</th>
                    <th style="width: 10%;">Base de cálculo</th>
                    <th style="width: 8%;" class="text-right">Deuda</th>
                    <th style="width: 8%;" class="text-right">Pagado</th>
                    <th style="width: 8%;" class="text-right">Abonado</th>
                    <th style="width: 8%;" class="text-right">Saldo</th>
                    <th style="width: 7%;">Estado</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
            </div>
        </div>
    </div>
{% endblock %}
