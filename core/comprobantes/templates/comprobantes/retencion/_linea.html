{% load widget_tweaks %}
                <fieldset class="row fp-retencion-linea"><legend>Línea {{ numero }}</legend>
                    {% for field in f %}
                        <div class="form-group col-12 {% if field.name == 'codigo' %}col-lg-6{% else %}col-md-6 col-lg-3{% endif %}">
                            <label for="{{ field.id_for_label }}" class="font-weight-bold">{{ field.label }}</label>
                            {% render_field field class="form-control" %}
                            {% if field.help_text %}<small class="form-text text-muted">{{ field.help_text }}</small>{% endif %}
                            {% if field.name == 'codigo' %}<small class="form-text text-muted fp-retencion-ayuda" aria-live="polite" hidden></small>{% endif %}
                            {% for error in field.errors %}<div class="invalid-feedback d-block" role="alert">{{ error }}</div>{% endfor %}
                        </div>
                    {% endfor %}
                </fieldset>
