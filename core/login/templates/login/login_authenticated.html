{% extends 'login/base.html' %}
{% load static %}

{% block content %}
    <main class="fpa-auth-card" aria-labelledby="titulo-sesion">
        {% include 'login/_marca.html' %}
        <h1 class="fpa-title" id="titulo-sesion">Ya tienes una sesión activa</h1>
        <div class="fpa-user">
            <img src="{{ request.user.get_image }}" alt="">
            <div><strong>{{ request.user.get_short_name }}</strong><br><span class="fpa-tagline">{{ request.user.username }}</span></div>
        </div>
        <a href="{% url 'dashboard' %}" class="fpa-btn-primary">Continuar</a>
        <a href="{% url 'login_different' %}" class="fpa-btn-secondary">Ingresar con otro usuario</a>
        {% include 'login/_pie.html' %}
    </main>
{% endblock %}
