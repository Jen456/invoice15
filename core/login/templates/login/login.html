{% extends 'login/base.html' %}
{% load static %}
{% block assets_login %}
    <script src="{% static 'login/js/login.js' %}"></script>
{% endblock %}

{% block content %}
    <div class="login-box">
        <div class="login-box-body">
            <div class="card">
                <div class="card-body login-card-body">
                    <div class="contact-image">
                        <img class="fp-login-isotipo" src="{% static 'img/brand/isotipo.png' %}" alt="Colibrí Ingenioso de FacturaPorAquí" width="150" height="130">
                    </div>
                    <h1 class="fp-login-brand">FacturaPorAquí</h1>
                    <p class="fp-login-caption">Tu negocio, en orden.</p>
                    <p class="login-box-msg">Bienvenido de nuevo</p>
                    <form method="post" id="frmForm" autocomplete="off">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ next }}">
                        <div class="form-group">
                            <label for="{{ form.username.id_for_label }}">{{ form.username.label }}:</label>
                            {{ form.username }}
                        </div>
                        <div class="form-group">
                            <label for="{{ form.password.id_for_label }}">{{ form.password.label }}:</label>
                            <div class="input-group">
                                {{ form.password }}
                                <div class="input-group-append">
                                    <button class="btn btn-primary btnShowPassword btn-flat" type="button" aria-label="Mostrar u ocultar contraseña">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-lg-12">
                                <button type="submit" class="btn btn-primary btn-block btn-flat">
                                    <i class="fas fa-sign-in-alt"></i> Ingresar
                                </button>
                            </div>
                        </div>
                    </form>
                    <p class="mt-3 text-center desc">
                        Si has olvidado tu contraseña <a href="{% url 'reset_password' %}">recupera tu acceso aquí <i
                            class="fas fa-key"></i></a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script type="application/javascript">
        {% if form.errors %}
            var errors = '';
            {% for field in form %}
                {% for error in field.errors %}
                    errors += '{{ error }}\n';
                {% endfor %}
            {% endfor %}
            {% for error in form.non_field_errors %}
                errors += '{{ error }}\n';
            {% endfor %}
            message_error(errors);
        {% endif %}
    </script>
{% endblock %}
