<dialog id="fp-product-dialog" class="fp-product-dialog" aria-labelledby="fp-product-title" aria-describedby="fp-product-help">
    <div class="fp-product-heading"><div><p class="fp-eyebrow">SIN SALIR DE TU FACTURA</p><h2 id="fp-product-title">Crear producto o servicio</h2></div><button type="button" class="fp-product-close" aria-label="Cerrar creación de producto">×</button></div>
    <p id="fp-product-help">Los datos de tu factura se conservan mientras completas este registro.</p>
    <p id="fp-product-loading" role="status">Cargando los campos…</p>
    <div id="fp-product-error" class="alert alert-danger" role="alert" tabindex="-1" hidden></div>
    <form id="fp-product-form" method="post" enctype="multipart/form-data" hidden>
        <div id="fp-product-fields" class="fp-product-fields"></div>
        <p id="fp-product-stock-note" class="fp-sale-note">Si controlas inventario, el producto se crea sin existencias. Registra su entrada antes de venderlo.</p>
        <details id="fp-product-extra"><summary>Descripción, costo e imagen</summary><div id="fp-product-extra-fields" class="fp-product-fields"></div></details>
        <div class="fp-product-footer"><button type="button" class="btn btn-outline-secondary fp-product-close">Volver a la factura</button><button type="submit" class="btn btn-primary" id="fp-product-save">Guardar producto</button></div>
    </form>
</dialog>
